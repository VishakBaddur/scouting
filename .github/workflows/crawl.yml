name: Daily crawl

on:
  schedule:
    - cron: "17 12 * * *"   # 12:17 UTC daily (7:17 AM Chicago)
  workflow_dispatch:         # allows a manual "Run workflow" button
  push:                      # also run when the company list or this workflow changes
    branches: [main]
    paths:
      - companies.example.yaml
      - .github/workflows/crawl.yml

permissions:
  contents: write            # needed to commit RUNS.md

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Yesterday's database, so new / updated / closed is tracked across days
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Crawl
        run: python -m jobscout crawl companies.example.yaml --db jobs.db --json > summary.json

      - name: Log run
        run: python scripts/log_run.py summary.json RUNS.md

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: crawl-summary-${{ github.run_id }}
          path: summary.json

      - name: Commit run log
        run: |
          git config user.name "jobscout-bot"
          git config user.email "jobscout-bot@users.noreply.github.com"
          git add RUNS.md
          git commit -m "crawl: daily run $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
